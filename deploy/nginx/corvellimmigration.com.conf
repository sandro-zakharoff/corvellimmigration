server {
    listen 80;
    server_name corvellimmigration.com www.corvellimmigration.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name corvellimmigration.com www.corvellimmigration.com;

    ssl_certificate /etc/ssl/certs/corvellcf/corvellimmigration.com-certificate.pem;
    ssl_certificate_key /etc/ssl/certs/corvellcf/corvellimmigration.com.key;

    root /var/www/corvellimmigration.com/dist;
    index index.html;

    access_log /var/log/nginx/corvellimmigration.access.log;
    error_log /var/log/nginx/corvellimmigration.error.log;

    client_max_body_size 32k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
